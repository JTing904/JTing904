# lowlighter/metrics — https://github.com/lowlighter/metrics
#
# 需要一个仓库 secret: METRICS_TOKEN
#   GitHub → Settings → Developer settings → Personal access tokens (classic)
#   → Generate new token，勾 public_repo 就够了
#   → 回到 JTing904/JTing904 → Settings → Secrets and variables → Actions
#   → New repository secret，名字填 METRICS_TOKEN
#
# 生成的 SVG 会被 action 自己提交进本仓库的 metrics/ 目录。
name: Metrics

on:
  schedule:
    - cron: "0 18 * * *"   # 每天 02:00 (UTC+8)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kuala_Lumpur

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Kuala_Lumpur
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: no

      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: Asia/Kuala_Lumpur
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/habits.svg
          base: ""
          config_timezone: Asia/Kuala_Lumpur
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Kuala_Lumpur
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
